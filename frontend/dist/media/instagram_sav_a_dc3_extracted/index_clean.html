<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mr. Douglas - Complete Gallery</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }
        .search-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #334155;
            padding: 1rem;
        }
        .search-container { max-width: 1200px; margin: 0 auto; }
        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 2rem;
            color: #f1f5f9;
            outline: none;
        }
        .search-input:focus { border-color: #3b82f6; }
        .wordcloud-container {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1rem;
        }
        .wordcloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
        }
        .cloud-word {
            cursor: pointer;
            transition: all 0.1s ease;
            color: #94a3b8;
        }
        .cloud-word:hover { color: #60a5fa; transform: scale(1.05); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 1rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .card-media {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #0f172a;
        }
        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #94a3b8;
            font-size: 2rem;
        }
        .card-content { padding: 1rem; }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .card-caption {
            font-size: 0.875rem;
            color: #cbd5e1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }
        .carousel {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
            padding-bottom: 0.5rem;
        }
        .carousel-item {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            cursor: pointer;
            background: #0f172a;
        }
        .carousel-video-placeholder {
            width: 60px;
            height: 60px;
            background: #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .comments-btn {
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 1rem;
            background: #1e293b;
        }
        .comments-btn:hover { background: #334155; }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        .insta-link {
            font-size: 0.75rem;
            color: #3b82f6;
            text-decoration: none;
        }
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .lightbox.active { display: flex; }
        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lightbox-media {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
        }
        .lightbox-close {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1010;
        }
        .lightbox-caption {
            margin-top: 1rem;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            max-width: 90vw;
            font-size: 0.875rem;
        }
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1e293b;
            border-radius: 1rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1100;
            display: none;
            padding: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        .modal.active { display: block; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .modal-close { cursor: pointer; font-size: 1.5rem; line-height: 1; }
        .comment-item { padding: 0.5rem 0; border-bottom: 1px solid #334155; }
        .no-results { text-align: center; padding: 3rem; color: #94a3b8; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="search-header">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search posts (fuzzy)..." autocomplete="off">
            <div class="wordcloud-container"><div id="wordcloud" class="wordcloud">Loading words...</div></div>
        </div>
    </div>
    <div class="gallery-toolbar" style="display:flex; gap:12px; margin:0 1.5rem 1rem 1.5rem; flex-wrap:wrap; align-items:center; background:#1e293b; padding:8px 12px; border-radius:12px;">
        <span>📌 Select images:</span>
        <button id="selectAllBtn" style="background:#334155; color:white; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">Select All</button>
        <button id="deselectAllBtn" style="background:#334155; color:white; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">Deselect All</button>
        <button id="addSelectedBtn" class="primary" style="background:#3b82f6; color:white; border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">➕ Add Selected to Storyboard</button>
        <span id="selectedCount">0 selected</span>
    </div>
    <div id="galleryGrid" class="grid"></div>
    <button id="openStoryboardBtn" style="position:fixed; bottom:20px; right:20px; background:#3b82f6; color:white; border:none; border-radius:50px; padding:12px 24px; font-size:1rem; font-weight:bold; cursor:pointer; z-index:1000;">🎨 Open Storyboard (36x48")</button>
    <div id="storyboardModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; overflow:auto;">
        <div style="background:#1e293b; margin:20px auto; padding:20px; border-radius:16px; max-width:95%; width:1200px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 style="color:white;">📸 Storyboard Builder – 36×48" @ 300 DPI</h3>
                <button id="closeStoryboardBtn" style="background:#475569; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">✖ Close</button>
            </div>
            <div style="background:#0f172a; border-radius:12px; padding:12px; text-align:center; overflow-x:auto;">
                <canvas id="storyboardCanvas" width="1080" height="1440" style="border:2px solid #475569; border-radius:8px; background:white;"></canvas>
            </div>
            <div style="display:flex; gap:10px; justify-content:center; margin:15px 0; flex-wrap:wrap;">
                <select id="templateSelect" style="padding:6px 12px; border-radius:8px;">
                    <option value="grid">Grid (3 cols)</option>
                    <option value="twoCol">Two columns</option>
                    <option value="threeCol">Three columns</option>
                    <option value="bigSmall">Big + Small</option>
                    <option value="center">Single centered</option>
                </select>
                <button id="applyTemplateBtn" style="background:#10b981; border:none; color:white; padding:8px 16px; border-radius:8px; cursor:pointer;">✨ Apply Template</button>
                <button id="exportStoryboardBtn" style="background:#10b981; border:none; color:white; padding:8px 16px; border-radius:8px; cursor:pointer;">⬇ Export PNG (10800×14400)</button>
                <button id="clearStoryboardBtn" style="background:#ef4444; border:none; color:white; padding:8px 16px; border-radius:8px; cursor:pointer;">🗑 Clear All</button>
            </div>
            <div><strong style="color:white;">📁 Images (click to remove):</strong>
                <div id="storyboardThumbnails" style="display:flex; gap:12px; overflow-x:auto; padding:8px;"></div>
            </div>
        </div>
    </div>
    <!-- Lightbox and Comments Modal (same as before) -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content"><div class="lightbox-close" id="lightboxClose">×</div><div id="lightboxMediaContainer"></div><div id="lightboxCaption" class="lightbox-caption"></div></div>
    </div>
    <div id="commentsModal" class="modal">
        <div class="modal-header"><strong>Comments</strong><span id="modalClose" class="modal-close">&times;</span></div>
        <div id="commentsList"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script>
        let allPosts = [];

        async function loadPosts() {
            const res = await fetch('posts.json');
            allPosts = await res.json();
            renderGallery(allPosts);
            updateWordCloud(allPosts);
        }

        function isVideo(filename) { return filename && /\.(mp4|mov|avi|mkv)$/i.test(filename); }
        function getMediaPath(folderName, fileName) { return `${folderName}/${fileName}`; }

        function renderGallery(posts) {
            const grid = document.getElementById('galleryGrid');
            if (!posts.length) { grid.innerHTML = '<div class="no-results">No posts match your search.</div>'; return; }
            grid.innerHTML = posts.map(post => {
                const primaryMedia = post.all_media.length ? post.all_media[0] : null;
                const carouselItems = post.all_media.slice(1).map(f => {
                    const path = getMediaPath(post.folder_name, f);
                    if (isVideo(f)) return `<div class="carousel-video-placeholder" data-media="${path}">🎬</div>`;
                    return `<img class="carousel-item" src="${path}" data-media="${path}" loading="lazy" onerror="this.outerHTML='<div class=\'carousel-video-placeholder\' data-media=\''+path+'\'>❌</div>';">`;
                }).join('');
                let mediaHtml = '';
                if (primaryMedia) {
                    const mediaPath = getMediaPath(post.folder_name, primaryMedia);
                    if (isVideo(primaryMedia)) mediaHtml = `<div class="video-placeholder card-media">🎬 Video</div>`;
                    else mediaHtml = `<img class="card-media" src="${mediaPath}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23334155%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2255%22%20text-anchor%3D%22middle%22%20fill%3D%22%2394a3b8%22%3E%E2%9D%8C%3C%2Ftext%3E%3C%2Fsvg%3E';">`;
                } else mediaHtml = `<div class="card-media" style="display:flex; align-items:center; justify-content:center;">📷 No media</div>`;
                return `<div class="card" data-shortcode="${post.shortcode}" data-caption="${post.caption.replace(/"/g, '&quot;')}"><div style="position:relative; width:100%; aspect-ratio:4/3;">${mediaHtml}</div><div class="card-content"><div class="card-meta"><span>📅 ${new Date(post.date).toLocaleDateString()}</span><span>❤️ ${post.likes}</span><span>💬 ${post.comments_count}</span></div><div class="card-caption">${post.caption.length > 180 ? post.caption.substring(0,180)+'…' : post.caption}</div>${carouselItems ? `<div class="carousel">${carouselItems}</div>` : ''}<div class="card-footer"><a href="${post.instagram_url}" target="_blank" class="insta-link">🔗 View on Instagram</a><button class="comments-btn" data-shortcode="${post.shortcode}">💬 ${post.comments.length} comments</button></div></div></div>`;
            }).join('');
            document.querySelectorAll('.comments-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const p = allPosts.find(p => p.shortcode === btn.dataset.shortcode); if(p && p.comments.length) { document.getElementById('commentsList').innerHTML = p.comments.map(c => `<div class="comment-item">💬 ${c}</div>`).join(''); document.getElementById('commentsModal').classList.add('active'); } else alert('No comments'); }));
            document.querySelectorAll('.carousel-item, .carousel-video-placeholder').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); const media = el.dataset.media; const card = el.closest('.card'); const caption = card.dataset.caption; openLightbox(media, caption); }));
        }

        function openLightbox(src, caption) {
            const container = document.getElementById('lightboxMediaContainer');
            container.innerHTML = '';
            if (src && src.match(/\.(mp4|mov|avi|mkv)$/i)) { const v = document.createElement('video'); v.src = src; v.controls = true; v.style.maxWidth='90vw'; v.style.maxHeight='85vh'; container.appendChild(v); }
            else if (src) { const img = document.createElement('img'); img.src = src; img.style.maxWidth='90vw'; img.style.maxHeight='85vh'; img.onerror = () => { img.style.display='none'; container.innerHTML='<div style="color:white;">Image failed to load</div>'; }; container.appendChild(img); }
            else container.innerHTML = '<div style="color:white;">No media available</div>';
            document.getElementById('lightboxCaption').innerText = caption;
            document.getElementById('lightbox').classList.add('active');
        }

        function updateWordCloud(posts) {
            const wordCount = {};
            posts.forEach(post => {
                (post.caption + ' ' + post.comments.join(' ')).toLowerCase().match(/\b[a-z]+\b/g)?.forEach(w => {
                    if (w.length > 2 && !/^(?:a|an|and|the|of|to|in|for|on|with|by|at|is|it|that|this|are|was|were|be|been|being|have|has|had|having|do|does|did|doing|but|or|so|for|not|can|will|just|like|get|put|up|down|out|over|under|again|further|then|once|here|there|all|any|both|each|few|more|most|other|some|such|no|nor|only|own|same|than|too|very|i|you|he|she|it|we|they|me|him|her|us|them|my|your|his|her|its|our|their|what|which|who|whom|whose|these|those|am|been|were|www|com|https|http|instagram|mrdouglas|follow|please|let|see|new|will|now|get|time|like|just)$/.test(w)) wordCount[w] = (wordCount[w] || 0) + 1;
                });
            });
            const words = Object.entries(wordCount).map(([w,c]) => ({word:w, count:c})).sort((a,b)=>b.count-a.count).slice(0,100);
            const maxF = words.length ? Math.max(...words.map(w=>w.count)) : 1;
            const container = document.getElementById('wordcloud');
            if (!words.length) { container.innerHTML = '<span style="color:#94a3b8;">No words found</span>'; return; }
            container.innerHTML = words.map(w => `<span class="cloud-word" data-word="${w.word}" style="font-size:${0.8 + (w.count/maxF)*1.5}rem;">${w.word}</span>`).join('');
            document.querySelectorAll('.cloud-word').forEach(el => el.addEventListener('click', () => { document.getElementById('searchInput').value = el.dataset.word; const event = new Event('input', { bubbles: true }); document.getElementById('searchInput').dispatchEvent(event); }));
        }

        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim().toLowerCase();
            debounceTimer = setTimeout(() => {
                const filtered = allPosts.filter(p => p.caption.toLowerCase().includes(query) || p.comments.some(c => c.toLowerCase().includes(query)));
                renderGallery(filtered);
                updateWordCloud(filtered);
            }, 200);
        });

        document.getElementById('lightboxClose').addEventListener('click', () => document.getElementById('lightbox').classList.remove('active'));
        document.getElementById('modalClose').addEventListener('click', () => document.getElementById('commentsModal').classList.remove('active'));
        window.addEventListener('click', (e) => { if (e.target === document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('active'); if (e.target === document.getElementById('commentsModal')) document.getElementById('commentsModal').classList.remove('active'); });
        document.getElementById('galleryGrid').addEventListener('click', (e) => { const card = e.target.closest('.card'); if (card && !e.target.closest('.carousel-item') && !e.target.closest('.carousel-video-placeholder') && !e.target.closest('.comments-btn') && !e.target.closest('a')) { let media = null; const img = card.querySelector('.card-media'); if (img && img.tagName === 'IMG') media = img.src; else if (card.querySelector('.video-placeholder')) { const shortcode = card.dataset.shortcode; const post = allPosts.find(p => p.shortcode === shortcode); if (post && post.all_media.length) media = getMediaPath(post.folder_name, post.all_media[0]); } openLightbox(media, card.dataset.caption); } });

        // === Storyboard (full) ===
        let storyboardImages = [], displayCanvas = null;
        const PREVIEW_W = 1080, PREVIEW_H = 1440, TARGET_W = 10800, TARGET_H = 14400, SCALE = TARGET_W / PREVIEW_W;
        const imgCache = new Map();

        function loadImage(src) {
            if (imgCache.has(src)) return Promise.resolve(imgCache.get(src));
            return new Promise((resolve, reject) => { const img = new Image(); img.crossOrigin = "Anonymous"; img.onload = () => { imgCache.set(src, img); resolve(img); }; img.onerror = reject; img.src = src; });
        }

        async function addImageToStoryboard(src, silent=false) {
            if (storyboardImages.some(i => i.src === src)) { if (!silent) alert("Image already in storyboard"); return false; }
            try {
                const imgEl = await loadImage(src);
                const aspect = imgEl.width / imgEl.height;
                const defW = 200, defH = defW / aspect;
                const newItem = { src, imgElement: imgEl, width: imgEl.width, height: imgEl.height, left: 50, top: 50, scaleX: defW / imgEl.width, scaleY: defH / imgEl.height, fabricObject: null };
                storyboardImages.push(newItem);
                if (displayCanvas) {
                    const fimg = new fabric.Image(imgEl, { left: 50, top: 50, scaleX: defW / imgEl.width, scaleY: defH / imgEl.height, hasControls: true, lockRotation: true });
                    newItem.fabricObject = fimg;
                    displayCanvas.add(fimg);
                    displayCanvas.renderAll();
                }
                updateThumbnails();
                return true;
            } catch(e) { if (!silent) alert("Failed: " + e.message); return false; }
        }

        async function addMultipleImages(srcList) {
            let added = 0;
            for (let src of srcList) if (await addImageToStoryboard(src, true)) added++;
            if (added) alert(`Added ${added} image(s)`);
            else if (srcList.length) alert("No new images (duplicates)");
            if (added) applyTemplate('grid');
        }

        function updateThumbnails() {
            const container = document.getElementById('storyboardThumbnails');
            if (!container) return;
            container.innerHTML = storyboardImages.map((img, idx) => `<img src="${img.src}" data-index="${idx}" style="width:80px; height:80px; object-fit:cover; border-radius:8px; cursor:pointer;">`).join('');
            document.querySelectorAll('#storyboardThumbnails img').forEach(thumb => thumb.addEventListener('click', () => { const idx = parseInt(thumb.dataset.index); if (!isNaN(idx)) { if (displayCanvas && storyboardImages[idx].fabricObject) displayCanvas.remove(storyboardImages[idx].fabricObject); storyboardImages.splice(idx, 1); displayCanvas?.renderAll(); updateThumbnails(); } }));
        }

        function applyTemplate(templateName) {
            if (!displayCanvas || storyboardImages.length === 0) return;
            const cnt = storyboardImages.length, margin = 20, w = PREVIEW_W - margin*2, h = PREVIEW_H - margin*2;
            const cols = 3, cellW = (w - (cols-1)*margin) / cols;
            for (let i=0; i<cnt; i++) {
                const row = Math.floor(i / cols), col = i % cols;
                const item = storyboardImages[i];
                const img = item.imgElement;
                let drawW = cellW, drawH = drawW / (img.width/img.height);
                if (drawH > 200) { drawH = 200; drawW = drawH * (img.width/img.height); }
                const left = margin + col * (cellW + margin), top = margin + row * (drawH + margin);
                item.left = left; item.top = top;
                item.scaleX = drawW / img.width; item.scaleY = drawH / img.height;
                if (item.fabricObject) item.fabricObject.set({ left, top, scaleX: item.scaleX, scaleY: item.scaleY });
            }
            displayCanvas.renderAll();
        }

        async function exportStoryboard() {
            if (!storyboardImages.length) { alert("No images"); return; }
            const off = document.createElement('canvas'); off.width = TARGET_W; off.height = TARGET_H;
            const ctx = off.getContext('2d'); ctx.fillStyle = 'white'; ctx.fillRect(0,0,TARGET_W,TARGET_H);
            for (let item of storyboardImages) {
                try {
                    const img = item.imgElement;
                    const left = (item.left||0)*SCALE, top = (item.top||0)*SCALE;
                    const w = img.width * (item.scaleX||1) * SCALE, h = img.height * (item.scaleY||1) * SCALE;
                    ctx.drawImage(img, left, top, w, h);
                } catch(e) {}
            }
            const a = document.createElement('a'); a.download = 'storyboard_36x48_300dpi.png'; a.href = off.toDataURL('image/png'); a.click();
        }

        function clearAll() { if (confirm("Clear all?")) { storyboardImages = []; displayCanvas?.clear(); displayCanvas?.renderAll(); updateThumbnails(); } }

        function initCanvas() {
            const canvas = document.getElementById('storyboardCanvas');
            if (!canvas) return;
            displayCanvas = new fabric.Canvas('storyboardCanvas');
            displayCanvas.setDimensions({ width: PREVIEW_W, height: PREVIEW_H });
            displayCanvas.on('object:modified', (e) => {
                const obj = e.target;
                const idx = storyboardImages.findIndex(i => i.fabricObject === obj);
                if (idx !== -1) { storyboardImages[idx].left = obj.left; storyboardImages[idx].top = obj.top; storyboardImages[idx].scaleX = obj.scaleX; storyboardImages[idx].scaleY = obj.scaleY; }
            });
            displayCanvas.renderAll(); updateThumbnails();
        }

        let selectedSrcs = new Set();
        function addCheckboxesToCards() {
            document.querySelectorAll('.card').forEach(card => {
                if (card.querySelector('.select-checkbox')) return;
                const img = card.querySelector('img');
                if (!img || !img.src || img.src.startsWith('data:')) return;
                const src = img.src;
                const chk = document.createElement('input');
                chk.type = 'checkbox'; chk.className = 'select-checkbox';
                chk.style.cssText = 'position:absolute; top:8px; left:8px; width:20px; height:20px; z-index:10; background:white; border-radius:4px; cursor:pointer;';
                chk.checked = selectedSrcs.has(src);
                chk.addEventListener('change', () => {
                    if (chk.checked) selectedSrcs.add(src); else selectedSrcs.delete(src);
                    document.getElementById('selectedCount').innerText = selectedSrcs.size + ' selected';
                });
                if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
                card.appendChild(chk);
            });
        }

        function selectAll() {
            document.querySelectorAll('.select-checkbox').forEach(chk => chk.checked = true);
            selectedSrcs.clear();
            document.querySelectorAll('.card img').forEach(img => { if (img.src && !img.src.startsWith('data:')) selectedSrcs.add(img.src); });
            document.getElementById('selectedCount').innerText = selectedSrcs.size + ' selected';
        }
        function deselectAll() {
            document.querySelectorAll('.select-checkbox').forEach(chk => chk.checked = false);
            selectedSrcs.clear();
            document.getElementById('selectedCount').innerText = '0 selected';
        }
        function addSelected() {
            const srcs = Array.from(selectedSrcs);
            if (srcs.length === 0) { alert("No images selected"); return; }
            addMultipleImages(srcs);
        }

        document.getElementById('selectAllBtn').addEventListener('click', selectAll);
        document.getElementById('deselectAllBtn').addEventListener('click', deselectAll);
        document.getElementById('addSelectedBtn').addEventListener('click', addSelected);
        document.getElementById('openStoryboardBtn').onclick = () => document.getElementById('storyboardModal').style.display = 'flex';
        document.getElementById('closeStoryboardBtn').onclick = () => document.getElementById('storyboardModal').style.display = 'none';
        document.getElementById('exportStoryboardBtn').onclick = exportStoryboard;
        document.getElementById('clearStoryboardBtn').onclick = clearAll;
        document.getElementById('applyTemplateBtn').onclick = () => { const tpl = document.getElementById('templateSelect').value; applyTemplate(tpl); };
        window.onclick = (e) => { if (e.target === document.getElementById('storyboardModal')) document.getElementById('storyboardModal').style.display = 'none'; };

        loadPosts().then(() => { initCanvas(); addCheckboxesToCards(); });
    </script>
</body>
</html>
